# TourDesk AI — OSS backing services (self-hosted, ADR-0030 / ADR-0018)
# The only external dependency NOT here is the LLM provider (ADR-0028).
# Started via: mise run up   (or: docker compose up -d)

name: tourdesk

services:
  # Source of truth + hybrid retrieval: RLS isolation (ADR-0015),
  # pgvector (semantic) + pg_search/BM25 (ADR-0012). ParadeDB ships both.
  postgres:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourdesk}
      POSTGRES_DB: ${POSTGRES_DB:-tourdesk}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 on host to avoid colliding with a system Postgres
    volumes:
      - pgdata:/var/lib/postgresql          # PG18+ images want the mount here, not /data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourdesk} -d ${POSTGRES_DB:-tourdesk}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Inter-service / inter-process communication bus + durable pipeline queue.
  # JetStream (-js) gives at-least-once, durable work-queue streams (NFR-S-04).
  nats:
    image: nats:latest
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"        # client
      - "${NATS_MONITOR_PORT:-8222}:8222" # monitoring / healthz
    volumes:
      - natsdata:/data

  # Document text extraction + OCR (FR-M4-02, FR-M1-09). '-full' bundles Tesseract.
  # Self-hosted so attachment PII never leaves our boundary (ADR-0018).
  tika:
    image: apache/tika:latest-full
    ports:
      - "${TIKA_PORT:-9998}:9998"

  # Attachment malware scanning before storage/extraction (SEC-07, FR-M1-09).
  clamav:
    image: clamav/clamav:latest
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s   # first start downloads the signature DB — slow

volumes:
  pgdata:
  natsdata:
  clamdata:
